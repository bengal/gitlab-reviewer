[project]
name = "gitlab-mr-review"
version = "0.1.0"
description = "Self-hosted LLM-driven code review of GitLab merge requests"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "sqlalchemy>=2",
    "alembic",
    "apscheduler",
    "requests",
    "itsdangerous",
    "cryptography",
    "pydantic-settings",
    "python-multipart",
    "psycopg[binary]>=3.3.5",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Form() in argument defaults are the idiomatic pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]
